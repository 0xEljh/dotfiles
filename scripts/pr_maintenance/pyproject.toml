[project]
name = "pr-maintenance"
version = "0.1.0"
description = "Durable, opt-in Eigenform PR maintenance"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pr-maintenance = "pr_maintenance.cli:main"
pr-worker = "pr_maintenance.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pr_maintenance"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
